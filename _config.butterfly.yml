# ============================================================
#  Butterfly 主题配置（_config.butterfly.yml）
#  只写与主题默认值不同的项；主题用 deepMerge 合并，
#  没写的键依然沿用 themes 里的默认值。
# ============================================================

# ---------------- 导航 ----------------
nav:
  logo: /img/avatar.jpg
  display_title: true
  display_post_title: true
  fixed: true

menu:
  随笔: /essays/ || fas fa-pen-nib
  笔记: /notes/ || fas fa-book-open
  项目: /projects/ || fas fa-code
  影视: /media/ || fas fa-film
  关于: /about/ || fas fa-user
  简历: /resume/ || fas fa-id-card
  更多||fas fa-ellipsis:
    留言板: /board/ || fas fa-comment-dots
    友链: /friends/ || fas fa-link
    统计: /stats/ || fas fa-chart-simple

# ---------------- 社交 ----------------
social:
  fab fa-github: https://github.com/202367jack || GitHub || '#24292e'
  fas fa-envelope: mailto:wangjie202367@qq.com || Email || '#4a7dbe'
  aether-gmail: 'mailto:wangjie202367@gmail.com || Gmail || #ea4335'
  fab fa-bilibili: https://space.bilibili.com/3494369350912310 || BiliBili || '#00a1d6'
  fab fa-x-twitter: 'https://x.com/JackWangNomad || X || #1da1f2'
  fab fa-facebook: 'https://www.facebook.com/profile.php?id=61595166796204 || Facebook || #1877f2'
  fab fa-instagram: 'https://www.instagram.com/wangjie20270607/?hl=zh-cn || Instagram || #e4405f'
  aether-douban: 'https://www.douban.com/people/292163236/?_i=25071534GT36CJ || 豆瓣 || #007722'

# ---------------- 图片 ----------------
favicon: /img/favicon.png

avatar:
  img: /img/avatar.jpg
  effect: false

# 列表页不显示封面（本站文章不用封面图）
cover:
  index_enable: false
  aside_enable: false
  archives_enable: false

# ---------------- 代码块 ----------------
code_blocks:
  theme: light          # 浅色配色；darker / pale night / light / ocean / false
  macStyle: true        # 仿 macOS 的红黄绿三个圆点
  height_limit: 600     # 超过 600px 自动折叠，点「展开全文」看全部
  word_wrap: true       # 长行自动换行，不横向滚动
  copy: true            # 右上角一键复制
  language: true        # 显示语言名
  shrink: true          # 默认折叠（配合 height_limit）
  fullpage: true        # 工具栏里的全屏按钮

# ---------------- Mermaid 图表 ----------------
# 正文里写 ```mermaid 代码块就能直接画流程图 / 时序图 / 架构图
mermaid:
  enable: true
  code_write: true
  theme:
    light: default
    dark: dark
  open_in_new_tab: true

# ---------------- 文章系列 ----------------
# front-matter 里写 series: 系列名，同名的文章会归成一个系列
series:
  enable: true
  orderBy: 'date'   # 按日期排（也可以 'title'）
  order: 1          # 1 = 正序（先发的在前），-1 = 倒序
  number: true      # 显示序号

# ---------------- 首页 ----------------
subtitle:
  enable: true
  effect: true
  source: false
  sub:
    - 写代码，也写点别的
    - Java 后端 · 分布式 · 自建环境
    - 记录 / 项目 / 影视

index_layout: 3
index_post_content:
  method: 2
  length: 180

# ---------------- 文章页 ----------------
post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    position: left
    date_type: created
    date_format: date
    categories: true
    tags: true
    label: true

toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href: https://github.com/202367jack
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

related_post:
  enable: true
  limit: 4

post_pagination: 1

# ---------------- 页脚 ----------------
footer:
  owner:
    enable: true
    since: 2026
  copyright:
    enable: true
    version: true

# ---------------- 侧栏 ----------------
aside:
  enable: true
  button: true
  mobile: true
  position: right
  card_author:
    enable: true
    description: Java 后端 · 自建服务器与自动化
    button:
      enable: true
      icon: fab fa-github
      text: GitHub
      link: https://github.com/202367jack
  card_announcement:
    enable: false
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 30
    color: false
    orderby: name
    order: 1
  card_archives:
    enable: true
    type: monthly
    format: YYYY年MM月
    limit: 8
  card_post_series:
    enable: true
    series_title: true
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true

# ---------------- 暗色模式 ----------------
darkmode:
  enable: true
  button: true
  # 跟随系统；系统不支持时 18:00–06:00 自动进入暗色
  autoChangeMode: 1

display_mode: light

# 把日夜切换放到右下角常驻按钮组（默认藏在齿轮后面，容易找不到）
rightside_item_order:
  enable: true
  hide: readmode,translate,hideAside
  show: darkmode
  

# ---------------- 图片查看 ----------------
lightbox: fancybox

# ---------------- 站内搜索 ----------------
search:
  use: local_search
  placeholder: 搜索文章…
  local_search:
    preload: true
    top_n_per_article: 2
    unescape: false
    pagination:
      enable: false

# ---------------- 评论：不要 ----------------
comments:
  use: giscus
  text: false
  lazyload: false
  count: false

# ---------------- 评论：giscus（GitHub Discussions） ----------------
# 启用要两步：
#   1. 仓库 Settings → General → Features 勾上 Discussions；
#   2. 打开 https://giscus.app/zh-CN ，填仓库名、选分类（建议 Announcements），
#      页面下方那行 data-category-id 的值粘到下面 category_id，
#      再把上面 comments.use 改成 giscus。
giscus:
  repo: '202367jack/hexo-aether-blog'
  repo_id: 'R_kgDOVQ_IMw'
  category_id: 'DIC_kwDOVQ_IM84DJN_4'
  light_theme: light
  dark_theme: dark
  js: https://giscus.app/client.js
  option:
    data-mapping: pathname
    data-strict: '0'
    data-reactions-enabled: '1'
    data-emit-metadata: '0'
    data-input-position: top
    data-lang: zh-CN
    data-loading: lazy
  card_post_count: false

# ---------------- 访问量统计：不要 ----------------
busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

# ---------------- 分享 / 字数：不要 ----------------
share:
  use:

wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

math:
  use:

# ---------------- 其他 ----------------
# 不注入任何第三方统计
baidu_analytics:
google_analytics:
cloudflare_analytics:
microsoft_clarity:

readmode: true
rightside_scroll_percent: true
enter_transitions: true
rounded_corners_ui: true
