name: 贡献热力图贪吃蛇

# 每天自动跑一次，也可以手动触发（Actions 页面 → Run workflow）
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 生成 SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: 202367jack
          # 配色跟着本站走：浅色是蓝，深色是青。color_dots 必须正好 5 个颜色，
          # 第一个是 0 贡献色，后四个从少到多。# 要写成 %23，否则 YAML 会当注释。
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%2349b1f5&color_dots=%23eef2f7,%23d7e9fb,%23a4d3f8,%236cb9f5,%232f8fd6
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%235cc4ff&color_dots=%23161b22,%23102a3c,%23184a63,%2320789c,%232fb8d9

      - name: 推到 output 分支
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
